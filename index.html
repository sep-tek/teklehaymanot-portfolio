<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Teklehaymanot — software engineering student and developer building thoughtful digital experiences through code, design, and technology."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Teklehaymanot — Software Engineering Student &amp; Developer" />
    <meta
      property="og:description"
      content="I build thoughtful digital experiences through code, design, and technology."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint. Without this the page would
      render Midnight for a frame and then snap to the user's choice.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('teklehaymanot:theme')
          var known = ['midnight', 'pearl', 'ocean', 'forest', 'violet']
          document.documentElement.dataset.theme =
            known.indexOf(stored) > -1 ? stored : 'midnight'
        } catch (error) {
          document.documentElement.dataset.theme = 'midnight'
        }
      })()
    </script>

    <title>Teklehaymanot — Creative Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
